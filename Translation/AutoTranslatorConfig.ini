; XUnity.AutoTranslator の設定(必要な項目だけ。残りは初回起動時に XUnity が既定値で書き足す)
; 置き場所: <プロファイル>\BepInEx\config\AutoTranslatorConfig.ini

[Service]
; 機械翻訳を使わない(プレイヤー名やチャットを外部に送らない)。翻訳表に載っている文だけ訳す
Endpoint=
FallbackEndpoint=

[General]
; 英語 → 日本語
Language=ja
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt

[TextFrameworks]
; IMGUI: BanEnforcer の画面や LateJoinNow の部屋情報表示に必要
EnableIMGUI=True
EnableUGUI=True
EnableTextMeshPro=True
